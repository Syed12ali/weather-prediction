[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-xai"
version = "0.1.0"
description = "Physics-informed climate forecasting with explainable AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.3.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "matplotlib>=3.8.0",
  "shap>=0.45.0",
  "streamlit>=1.36.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
